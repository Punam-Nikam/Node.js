<!DOCTYPE html>
<html>

<head>

    <title>Passport Local Login</title>

</head>

<body>

    <h1>Login</h1>


    <form action="/auth/login" method="POST">

        <label>Username:</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Password:</label>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Username: rashika
    </p>

    <p>
        Password: 1234
    </p>

</body>

</html>
